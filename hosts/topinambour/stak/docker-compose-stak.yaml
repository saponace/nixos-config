    image: lscr.io/linuxserver/sabnzbd:5.0.3-ls255
    container_name: sabnzbd
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_DATA:?err}/sabnzbd:/config
      - ${FOLDER_FOR_MEDIA:?err}:/data
    ports:
      - "${WEBUI_PORT_SABNZBD:?err}:8080"
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:sabnzbd
      - TP_THEME=${TP_THEME:?err}
    networks:
      - stak

###########################################################################
###########################################################################
##
##  Docker Compose File: Sonarr (LinuxServer.io)
##  Function: Series Library Manager (TV Shows)
##
##  Documentation: https://docs.linuxserver.io/images/docker-sonarr
##
###########################################################################
###########################################################################
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.17.2952-ls312
    container_name: sonarr
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_DATA:?err}/sonarr:/config
      - ${FOLDER_FOR_MEDIA:?err}:/data
    ports:
      - "${WEBUI_PORT_SONARR:?err}:8989"
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:sonarr
      - TP_THEME=${TP_THEME:?err}
    networks:
      - stak

###########################################################################
###########################################################################
##
##  Docker Compose File: Recyclarr (recyclarr)
##  Function: Sync TRaSH Guide quality profiles to Radarr and Sonarr
##
##  Documentation: https://recyclarr.dev/wiki/
##
###########################################################################
###########################################################################
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:7.4.1
    container_name: recyclarr
    user: ${PUID}:${PGID}
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_DATA:?err}/recyclarr:/config
      - /etc/stak/recyclarr.yml:/config/recyclarr.yml:ro
    environment:
      - TZ=${TIMEZONE:?err}
      - CRON_SCHEDULE=0 3 * * 0
      - SONARR_API_KEY=${SONARR_API_KEY:?err}
      - RADARR_API_KEY=${RADARR_API_KEY:?err}
    networks:
      - stak

###########################################################################
###########################################################################
##
##  Docker Compose File: calibre-web (LinuxServer.io)
##  Function: Book library manager
##
##  Documentation: https://docs.linuxserver.io/images/calibre-web
##
###########################################################################
###########################################################################
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:0.6.26-ls384
    container_name: calibre-web
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_DATA:?err}/calibre-web:/config
      - ${FOLDER_FOR_MEDIA:?err}/media/books:/books
    ports:
      - "${WEBUI_PORT_CALIBREWEB:?err}:8083"
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
      - DOCKER_MODS=linuxserver/mods:universal-calibre
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:calibre-web
      - TP_THEME=${TP_THEME:?err}
    networks:
      - stak

###########################################################################
###########################################################################
##
##  Docker Compose File: Home Assistant (home-assistant.io)
##  Function: Home automation hub
##
##  Documentation: https://www.home-assistant.io/installation/linux#docker-compose
##
###########################################################################
###########################################################################
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.8
    container_name: homeassistant
    restart: unless-stopped
    # Host network: mDNS/SSDP discovery of LAN devices doesn't cross the bridge.
    # Serves 8123, opened in the host firewall (host-net skips docker's bypass).
    network_mode: host
    volumes:
      - ${FOLDER_FOR_DATA:?err}/homeassistant:/config
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=${TIMEZONE:?err}
    # Zigbee coordinator
    devices:
      - /dev/serial/by-id/usb-Silicon_Labs_CP2102N_USB_to_UART_Bridge_Controller_ca07893e4029f111a49846adfa551895-if00-port0:/dev/ttyUSB0
