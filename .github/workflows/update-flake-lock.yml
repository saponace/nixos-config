name: update-flake-lock

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: # manual trigger from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake update
      # Stylix reads theme files from these packages at eval time (IFD), which --no-build below can't realise
      - run: nix build --no-link .#nixosConfigurations.celeri.pkgs.base16-schemes .#nixosConfigurations.celeri.pkgs.alacritty-theme
      # Only open a PR if all hosts still evaluate with the new inputs
      - run: nix flake check --no-build --all-systems
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: update-flake-lock
          commit-message: Update flake.lock
          title: Update flake.lock
          body: Weekly input bump. `nix flake check --no-build --all-systems` passed.
