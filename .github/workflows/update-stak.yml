name: update-stak

on:
  schedule:
    - cron: "0 6 1 * *" # 1st of the month, 06:00 UTC
  workflow_dispatch: # manual trigger from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - id: bump
        run: |
          set -o pipefail
          nix run .#update-stak | tee "$RUNNER_TEMP/bumps.md"
          {
            echo 'body<<PR_BODY'
            echo 'Monthly image bump for the `stak` docker-compose stack.'
            echo
            cat "$RUNNER_TEMP/bumps.md"
            echo 'PR_BODY'
          } >> "$GITHUB_OUTPUT"
      # No-op when nothing moved: create-pull-request skips an empty diff
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: update-stak
          commit-message: Update stak container images
          title: Update stak container images
          body: ${{ steps.bump.outputs.body }}
